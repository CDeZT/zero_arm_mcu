unit_completion_record:
  required_fields:
    - unit
    - commit
    - files
    - interfaces_added
    - commands_run
    - tests_passed_failed_not_run
    - performance
    - hardware_connected
    - hardware_command_categories_sent
    - action_commands_sent
    - approvals_pending
    - known_limitations
    - next_unit
  stop_after_each_unit: true
