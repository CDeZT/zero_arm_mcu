    name: engineering_baseline
    status: pending
    depends_on: []
    creates: [pyproject.toml, src_layout, tests_layout, resources_layout, minimal_qt_window]
    verifies: [clean_install, lint, type_check, pytest, gui_start_close_without_hardware]
    hardware: none

  - id: 1
