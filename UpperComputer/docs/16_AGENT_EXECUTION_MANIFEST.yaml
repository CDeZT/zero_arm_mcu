manifest:
  schema: zeroarm-agent-execution/v1
  purpose: deterministic_handoff_to_delegated_coding_agent
  authoritative_plan: 05_IMPLEMENTATION_PLAN.md
  implementation_blueprint: 15_IMPLEMENTATION_BLUEPRINT.md
  api_contracts: 17_API_DATA_AND_FIXTURE_CONTRACTS.md

entrypoint:
  working_directory: repository_root
  one_sentence_prompt: >-
    严格按照UpperComputer/AGENTS.md、PROJECT_SPEC.yaml和
    docs/16_AGENT_EXECUTION_MANIFEST.yaml，从IMPLEMENTATION_STATUS.md标记的首个
    未完成单元开始，完成该单元全部实现、测试、集成、文档和独立Git提交后停止报告，
    禁止绕过协议审批与机械安全门。
  algorithm:
    - read_root_and_nested_agents
    - read_project_spec_and_implementation_status
    - locate_first_pending_unit_with_completed_dependencies
    - read_unit_plan_blueprint_contracts_and_related_specs
    - inspect_live_environment_source_and_git_status
    - declare_files_scope_tests_and_hardware_command_boundary
    - establish_failing_or_missing_test_evidence
    - implement_and_integrate_without_stubs
    - execute_all_applicable_quality_gates
    - update_status_traceability_and_evidence
    - inspect_diff_and_stage_only_current_unit
    - create_one_atomic_commit_if_current_user_authorization_remains_in_effect
    - stop_and_report

fixed_decisions:
  primary_platform: windows
  language: python
  python_range: ">=3.12,<3.14"
  gui: PySide6
  transports_first_release: [mock, serial]
  domain_joint_unit: signed_integer_urad
  gui_render_fps_max: 60
  v1_state_poll_hz_options: [20, 50, 100]
  v1_action_stream_hz_max: 50
  v1_inflight_requests_max: 1
  local_database: sqlite
  portable_bundle: required
  installer: recommended
  account_and_role_system: forbidden

git:
  atomic_commit_each_completed_problem: true
  push: false
  release: false
  stage_scope: current_unit_only
  preserve_unrelated_dirty_files: true
  forbidden:
    - reset_hard
    - checkout_cleanup
    - clean
    - stash_unrelated_changes
    - force_push

hardware:
  current_state: arm_not_assembled
  default_allowed:
    - flash_verify_reset
    - HELLO
    - GET_STATE
    - approved_future_readonly_capability
    - malformed_readonly_frame_for_recovery_test
  default_forbidden:
    - ENABLE
    - DISABLE
    - STOP
    - HOME
    - TEACH_START
    - TEACH_STOP
    - SET_JOINT_TARGET
    - trajectory_playback
    - cartesian_send
    - gamepad_motion
    - recipe_motion
  rule: physical_safety_confirmation_is_required_per_action_test_scope

quality_commands:
  provisional_until_unit_0:
    lint: python -m ruff check UpperComputer
    format: python -m ruff format --check UpperComputer
    type: python -m mypy UpperComputer/src
    test: python -m pytest UpperComputer/tests -q
  rules:
    - report_exact_command_exit_code_and_test_count
    - never_report_compilation_as_execution
    - missing_tool_requires_diagnosis_install_attempt_or_explicit_alternative
    - hardware_report_must_list_every_command_category_sent

