# Standalone OpenOCD flash script with verification.
#
# Run from this project root with:
#   C:/Tools/OpenOCD-20260121-0.12.0/bin/openocd.exe ^
#     -s C:/Tools/OpenOCD-20260121-0.12.0/share/openocd/scripts ^
#     -f openocd_flash_verify.cfg
#
# Expected success lines:
#   ** Programming Finished **
#   ** Verify Started **
#   ** Verified OK **
#   ** Resetting Target **

adapter driver cmsis-dap
cmsis-dap backend usb_bulk
transport select swd
adapter speed 100

source [find target/stm32g4x.cfg]

init
reset halt
program build/Debug/M_Project.elf verify reset
shutdown
