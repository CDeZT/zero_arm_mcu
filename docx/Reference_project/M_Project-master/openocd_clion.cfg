# OpenOCD config for CLion / STM32G474 / CMSIS-DAP
#
# CLion usage:
#   1. Open this inner project folder:
#      C:/Users/ASUS/Downloads/M_Project-master/M_Project-master
#   2. Settings -> Build, Execution, Deployment -> Embedded Development:
#      set OpenOCD location to:
#      C:/Tools/OpenOCD-20260121-0.12.0/bin/openocd.exe
#   3. Add an "OpenOCD Download & Run" configuration and select this file.
#   4. Use build/Debug/M_Project.elf as the executable.
#
# Important:
#   Do not call init/reset/program in this file. CLion appends commands such as
#   "tcl_port disabled" and "gdb_port disabled" after loading this cfg, and those
#   commands must run before OpenOCD init.
#
# Verification:
#   If CLion runs:
#       program ".../M_Project.elf"
#   OpenOCD will only print "Programming Finished".
#   To see "Verified OK", CLion must run:
#       program ".../M_Project.elf" verify
#   Or use openocd_flash_verify.cfg / flash_verify.bat in this folder.

adapter driver cmsis-dap
cmsis-dap backend usb_bulk
transport select swd

# Keep this conservative. Some CMSIS-DAP probes/long wires are unstable at high speed.
adapter speed 100

source [find target/stm32g4x.cfg]
